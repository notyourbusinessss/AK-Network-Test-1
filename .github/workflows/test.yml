name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: IPv6 loopback and internet available?
        run: |
          cat /proc/net/if_inet6 || true
          curl -sSI --max-time 10 https://example.com | head -1 || true
      - name: Run the suite (includes the public-internet and IPv6 tests)
        run: ./run.sh
