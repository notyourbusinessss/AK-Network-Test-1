# Reports the pinned Ak submodule to GitHub's dependency graph (a submodule is not read from a manifest).
name: Dependency submission
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit the Ak submodule as a dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUB=$(git ls-tree HEAD ak | awk '{print $3}')
          URL=$(git config -f .gitmodules submodule.ak.url)
          REPO=$(echo "$URL" | sed -E 's#https://github.com/##; s#\.git$##')
          PURL="pkg:github/${REPO}@${SUB}"
          jq -n --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg run "$GITHUB_RUN_ID" --arg purl "$PURL" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            version: 0, sha: $sha, ref: $ref,
            job: {correlator: "dependency-submission", id: $run},
            detector: {name: "submodule-detector", version: "1.0.0", url: "https://github.com/notyourbusinessss/AK-Network-Test-1"},
            scanned: $now,
            manifests: {".gitmodules": {name: ".gitmodules", file: {source_location: ".gitmodules"},
              resolved: {($purl): {package_url: $purl, relationship: "direct", scope: "runtime"}}}}
          }' > snapshot.json
          cat snapshot.json
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" --input snapshot.json
